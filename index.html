<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puck Suisse">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0;background:#0a1020}</style>
<script>
// ===== Puck Suisse (version web) : IA Claude avec ta propre clé d'API =====
// La clé reste uniquement dans ce navigateur (localStorage). Sans clé : réponses automatiques intégrées.
(function(){
const KEY='puck.apikey',MODEL='claude-haiku-5-5';
const getKey=()=>{try{return localStorage.getItem(KEY)||'';}catch(e){return'';}};
const setKey=k=>{try{k?localStorage.setItem(KEY,k):localStorage.removeItem(KEY);}catch(e){}try{SAMPLE=undefined;}catch(e){}};
async function ask(prompt,maxTok){const k=getKey();if(!k)throw{code:'not_granted'};
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:MODEL,max_tokens:maxTok||500,messages:[{role:'user',content:prompt}]})});
 if(!r.ok){let m='';try{m=(await r.json()).error.message;}catch(e){}const err=new Error(m||('HTTP '+r.status));err.status=r.status;throw err;}
 const d=await r.json();return(d.content||[]).map(c=>c.text||'').join('');}
function parseJSON(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('pas de JSON');return JSON.parse(t.slice(a,b+1));}
window.claude={use:async name=>{if(name!=='sample'||!getKey())throw{code:'not_granted'};
 return{json:async(prompt)=>parseJSON(await ask(prompt+'\n\nRéponds uniquement avec l\'objet JSON demandé, sans aucun texte autour.')),text:async p=>ask(p)};}};
// --- fenêtre de réglage
const css=`#aiset{position:fixed;inset:0;z-index:9999;background:rgba(4,8,18,.8);display:flex;align-items:center;justify-content:center;padding:16px;font-family:Barlow,system-ui,sans-serif}
#aiset .bx{background:#121b30;border:1px solid #243352;border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:18px;color:#e9eef7}
#aiset h3{margin:0 0 6px;font-family:Teko,system-ui;font-size:28px;letter-spacing:.02em}#aiset p{color:#9fb0cf;font-size:14px;line-height:1.45;margin:6px 0}
#aiset input{width:100%;box-sizing:border-box;background:#0a1020;border:1px solid #243352;color:#e9eef7;border-radius:10px;padding:11px;font-size:14px;margin:8px 0}
#aiset .row{display:flex;gap:8px;flex-wrap:wrap}#aiset button{border:1px solid #243352;background:#18233d;color:#e9eef7;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
#aiset button.pr{background:#ffb627;color:#1d1404;border-color:#ffb627}#aiset .st{margin-top:10px;font-weight:600;font-size:14px}#aiset .ok{color:#3fcf8e}#aiset .ko{color:#ff7b7b}
#aiBtn{position:fixed;right:12px;bottom:12px;z-index:50;border:1px solid #243352;background:rgba(18,27,48,.92);color:#e9eef7;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;font-family:Barlow,system-ui}`;
function openSet(){let el=document.getElementById('aiset');if(el)el.remove();el=document.createElement('div');el.id='aiset';const k=getKey();
 el.innerHTML=`<div class="bx"><h3>IA Claude</h3><p>Avec ta clé d'API, Claude écrit les répliques des négociations, interviews et conférences de presse. Sans clé, le jeu utilise ses réponses automatiques.</p>
 <p>Statut : <b class="${k?'ok':''}">${k?'clé enregistrée ('+k.slice(0,10)+'…'+k.slice(-4)+')':'aucune clé'}</b></p>
 <input id="aikey" type="password" autocomplete="off" placeholder="Colle ta clé ici (sk-ant-…)">
 <div class="row"><button class="pr" data-a="save">Enregistrer</button><button data-a="test">Tester</button><button data-a="del">Effacer la clé</button><button data-a="close">Fermer</button></div>
 <div class="st" id="aist"></div>
 <p style="font-size:12px">La clé reste uniquement dans ce navigateur, sur cet appareil. Ne la partage jamais. Coût indicatif : environ 0,0002 $ par réplique (modèle ${MODEL}). Fixe une limite de dépenses dans la console Claude.</p></div>`;
 document.body.appendChild(el);const st=el.querySelector('#aist');
 el.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b){if(e.target===el)el.remove();return;}const a=b.dataset.a;
  if(a==='close'){el.remove();return;}
  if(a==='del'){setKey('');openSet();document.getElementById('aist').textContent='Clé effacée : le jeu utilise les réponses automatiques.';return;}
  if(a==='save'){const v=el.querySelector('#aikey').value.trim();if(!v){st.className='st ko';st.textContent='Colle d\'abord ta clé.';return;}setKey(v);openSet();a2('test');return;}
  if(a==='test')a2('test');});
 async function a2(){const s=document.getElementById('aist');if(!getKey()){s.className='st ko';s.textContent='Aucune clé enregistrée.';return;}s.className='st';s.textContent='Test en cours…';
  try{const t=await ask('Réponds juste : « Prêt pour le match ! »',30);s.className='st ok';s.textContent='Ça marche ! Claude répond : '+t.trim();}
  catch(err){s.className='st ko';s.textContent=err.status===401?'Clé refusée : vérifie que tu l\'as copiée en entier.':err.status===400&&/credit/i.test(err.message)?'Plus de crédit sur ton compte : recharge dans la console Claude.':err.status===429?'Trop de demandes : réessaie dans une minute.':'Échec : '+(err.message||'pas de connexion');}}}
function addBtn(){const m=document.getElementById('menu');let b=document.getElementById('aiBtn');if(!b){b=document.createElement('button');b.id='aiBtn';b.onclick=openSet;document.body.appendChild(b);}
 b.textContent=getKey()?'🤖 IA Claude : activée':'🤖 IA Claude';b.style.display=m&&!m.hidden&&getComputedStyle(m).display!=='none'?'':'none';}
window.addEventListener('DOMContentLoaded',()=>{const s=document.createElement('style');s.textContent=css;document.head.appendChild(s);addBtn();setInterval(addBtn,700);});
})();

</script>
<title>Puck Suisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: arena at night — one-screen app, scoreboard LED amber over dark rink-side navy */
:root{
 --topgap:48px;
 --u:clamp(56px,min(15vmin,17vh),116px);
 --night:#0a1020; --panel:#121b30; --panel2:#18233d; --line:#243352; --text:#e9eef7; --mute:#8e9cb8;
 --amber:#ffb627; --red:#e2363f; --blue:#3a74e6; --ice:#e8f1f7; --good:#3fcf8e;
 --display:'Teko','Arial Narrow',Impact,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--text);font:15px/1.45 var(--body);overscroll-behavior:none}
#app{height:100%;max-width:560px;margin:0 auto}
.screen{min-height:100%;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.kicker{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.chip{display:inline-block;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);box-shadow:0 0 0 1.5px rgba(255,255,255,.25);vertical-align:-2px;margin:0 6px 0 0;flex:none}
span+.chip,b+.chip{margin:0 0 0 6px}

/* menu */
.hero{padding-block:22px 6px;position:relative}
.hero h1{font:700 clamp(72px,21vw,124px)/.78 var(--display);margin:10px 0 0;display:flex;flex-direction:column;text-transform:uppercase;letter-spacing:.01em}
.hero h1 span:last-child{color:var(--amber);padding-left:.18em}
.rinkline{display:flex;gap:6px;margin-top:14px}.rinkline b{height:5px;flex:1;background:var(--blue)}.rinkline b:nth-child(2){background:var(--red);flex:.6}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 16px;text-align:left;font-weight:600}
.btn:active{transform:translateY(1px)}
.btn.big{display:flex;flex-direction:column;gap:2px;padding:14px 18px}
.btn.big span{font:600 28px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.btn.big small{color:var(--mute);font-weight:500;font-size:13px;display:flex;align-items:center}
.btn.primary{background:var(--amber);color:#1d1404;border-color:var(--amber)}
.btn.primary small{color:#5a3f08}
.opts{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.seg{display:flex;background:var(--night);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:6px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--amber)}
.stats,.mestats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div,.mestats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
.stats b,.mestats b{font:600 30px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.stats span,.mestats span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.mestats sup{font-size:.5em}
.titles{color:var(--amber);font-weight:600;margin:0}
.help{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--mute)}
.help summary{color:var(--text);font-weight:600;cursor:pointer}.help p{margin:10px 0 0;max-width:65ch}.help b{color:var(--text)}

/* pick */
.top{display:flex;align-items:center;gap:12px}
.top h2{font:600 32px/1 var(--display);margin:0;text-transform:uppercase;display:flex;align-items:center;min-width:0}
.top h2 .chip{width:18px;height:18px}
.back{border:0;background:var(--panel);border-radius:8px;padding:8px 12px;color:var(--mute);font-weight:600;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:4px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;position:relative;overflow:hidden}
.team::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--a)}
.jersey{grid-row:1/3;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.tn{font-weight:700;font-size:14px;line-height:1.15;grid-column:2/4;min-width:0}
.tr{height:4px;background:var(--night);border-radius:2px;overflow:hidden}.tr i{display:block;height:100%;background:var(--amber)}
.to{font:600 18px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}

/* hub */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card p{margin:0;color:var(--mute)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.side .chip{width:40px;height:40px;margin:0}
.side b{font:600 22px/1 var(--display);text-transform:uppercase}.side small{color:var(--mute);font-size:12px}
.v{font:600 22px var(--display);color:var(--mute)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:10px}.row2 .btn{text-align:center}
.champ{border-color:var(--amber)}.champ .cname{font:600 30px/1 var(--display);text-transform:uppercase;display:flex;align-items:center}
.champ.me{background:linear-gradient(160deg,#3b2a05,var(--panel) 60%)}
h3{font:600 22px/1 var(--display);text-transform:uppercase;margin:6px 0 -6px;letter-spacing:.02em}
.res{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.res li{display:grid;grid-template-columns:1fr auto 1fr 44px;align-items:center;gap:10px;background:var(--panel);border-radius:8px;padding:7px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.res li span:first-child{text-align:right;display:flex;justify-content:flex-end;align-items:center;flex-direction:row}
.res li span:nth-child(3){display:flex;align-items:center}
.res li b{font:600 20px/1 var(--display);color:var(--text)}
.res li em{font-style:normal;color:var(--mute);font-size:12px}
.res li.me{box-shadow:inset 3px 0 0 var(--amber)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 5px;text-align:center}th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid var(--line)}
td.l,th.l{text-align:left;white-space:nowrap}td.p{font-weight:700;color:var(--amber)}
tr.me td{background:rgba(255,182,39,.1)}tr.cut td{border-bottom:2px dashed var(--line)}
.note{font-size:12px;color:var(--mute);margin:-6px 0 0}
.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pr{display:flex;flex-direction:column;gap:6px}
.ser{background:var(--panel);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.ser span{display:flex;align-items:center;color:var(--mute)}.ser span b{margin-left:auto;font-family:var(--display);font-size:18px}
.ser span.w{color:var(--text)}.ser span.w b{color:var(--amber)}.ser.me{box-shadow:inset 3px 0 0 var(--amber)}

/* song row */
.sel{background:var(--night);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-weight:600}
.songrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.songname{flex:1 1 100%;font-weight:600;color:var(--text);min-width:0;overflow-wrap:anywhere}
.btn.small{padding:7px 12px;font-size:13px;text-align:center}
.songoff{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.songoff input{width:70px;background:var(--night);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.opt .note{margin:4px 0 0}
/* game */
#game{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;background:var(--night);padding:0;gap:0;height:auto;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
.board{display:grid;grid-template-columns:1fr auto 1fr auto auto;align-items:center;gap:8px;padding:8px 12px;background:#050913;border-bottom:2px solid #1b2742}
.tm{display:flex;align-items:center;gap:8px;font:600 22px/1 var(--display)}
.tm:last-of-type{justify-content:flex-end}.tid{display:inline-flex;flex-direction:column;align-items:center;line-height:.95}.sog{font:600 9px/1 Barlow,sans-serif;color:#9fb0c8;letter-spacing:.06em;margin-top:1px}
.score{display:flex;align-items:center;gap:10px;font:700 40px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,182,39,.45)}
.score .mid{display:flex;flex-direction:column;align-items:center;min-width:64px}
.score #clk{font-size:24px;color:var(--text);text-shadow:none}.score #per{white-space:nowrap;font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
#sb0{justify-content:flex-start}#sb1{justify-content:flex-end}
#bPause{border:0;background:var(--panel);border-radius:8px;width:36px;height:36px;font-weight:700;color:var(--mute)}
#rinkwrap{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#16213a,#060a14 75%)}
#cv{position:absolute;inset:0;display:block}
#stickBase{position:absolute;width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(10,16,32,.25);transform:translate(-50%,-50%);pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:calc(var(--u)*0.75);height:calc(var(--u)*0.75);border-radius:50%;background:rgba(255,182,39,.85);transform:translate(-50%,-50%)}
.pad{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(var(--u)*2.95);height:calc(var(--u)*2.95);pointer-events:none}
.btnc{opacity:.88;border:0;border-radius:50%;font:700 20px/1 var(--display);letter-spacing:.06em;display:grid;place-items:center;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#bShoot{position:absolute;right:0;bottom:0;width:calc(var(--u)*1.32);height:calc(var(--u)*1.32);background:var(--red);color:#fff;font-size:calc(var(--u)*0.4)}
#bA{position:absolute;right:calc(var(--u)*1.42);bottom:0;width:calc(var(--u)*1.22);height:calc(var(--u)*1.22);background:var(--blue);color:#fff;font-size:calc(var(--u)*0.25);letter-spacing:.02em}
#bB{position:absolute;right:calc(var(--u)*0.16);bottom:calc(var(--u)*1.46);width:var(--u);height:var(--u);background:#e0892a;color:#fff;font-size:calc(var(--u)*0.2)}
#bC{position:absolute;right:calc(var(--u)*0.12);bottom:calc(var(--u)*1.45);width:var(--u);height:var(--u);background:#7a4fd6;color:#fff;font-size:calc(var(--u)*0.18)}
#bC.def{background:#3d5a6e}
#bA.def{background:#4d5f86}
#bShoot.def{background:#9b3b34}
#lineInfo{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;background:rgba(10,16,32,.78);border-radius:8px;padding:7px 9px;font:600 12px/1.1 var(--body);color:var(--text);pointer-events:none;min-width:118px}
#cap{position:absolute;left:50%;transform:translateX(-50%);top:46px;max-width:min(92%,460px);background:rgba(10,16,32,.82);color:#e9eef7;border-left:3px solid var(--amber);border-radius:6px;padding:7px 11px;font:600 13px/1.35 var(--body);pointer-events:none;z-index:3;text-align:left}
#lineInfo em{font-style:normal;color:var(--mute);font-size:11px}
#lineInfo .sta{display:block;height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}#lineInfo .sta i{display:block;height:100%}
#bFight{position:absolute;top:92px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;padding:10px 18px;background:#e2363f;color:#fff;font:700 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:4;animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.07)}}
#chal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,9,19,.6);z-index:6}#bB.def{background:#9b3b34}
.btnc{pointer-events:auto}
.penbar{position:absolute;top:8px;left:8px;right:8px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;pointer-events:none;font:600 13px/1 var(--body)}
.penbar span{display:inline-block;background:rgba(226,54,63,.92);color:#fff;border-radius:6px;padding:5px 8px;margin:0 4px 4px 0;font-variant-numeric:tabular-nums}
.penbar .p1{text-align:right}.penbar .pm:not(:empty){background:rgba(10,16,32,.85);color:#ffb627;border-radius:6px;padding:5px 8px;align-self:start}
.btnc.pr{transform:scale(.92);filter:brightness(1.2)}
.hint{display:none!important;position:absolute;left:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));color:rgba(233,238,247,.45);font-size:12px;pointer-events:none;max-width:40%}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,9,19,.7);z-index:5}
.ovb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(320px,calc(100% - 32px));text-align:center;display:flex;flex-direction:column;gap:12px}
.ovb h2{font:600 38px/1 var(--display);margin:0;text-transform:uppercase}.ovb p{margin:0;color:var(--mute);font-weight:600}
.ovb .btn{text-align:center}

/* result */
#result{justify-content:center}
.rbox{display:flex;flex-direction:column;gap:14px}
.rbox h1{font:700 96px/.8 var(--display);margin:0;text-transform:uppercase}
.rbox.win h1{color:var(--amber)}.rbox.loss h1{color:var(--mute)}
.rsc{display:flex;flex-direction:column;gap:6px}

function shootout(){

function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=rnd();}while(p>L);return k-1;}
var HOMEADV_HOOK=null;
function simMatch(h,a,playoff){
 const df=(TEAMS[h].ovr-TEAMS[a].ovr+(HOMEADV_HOOK?HOMEADV_HOOK(h,a):0))/10;
 let gh=poisson(2.75*Math.exp(0.3*df)+0.15),ga=poisson(2.75*Math.exp(-0.3*df));
 let type='REG';
 if(gh===ga){const ph=1/(1+Math.exp(-0.35*df*2));
  if(playoff||rnd()<0.68){type='OT';}else type='SO';
  if(rnd()<ph)gh++;else ga++;}
 return{gh,ga,type};
}
function newSeason(user,double,diff,per){
 const n=TEAMS.length,arr=[...Array(n).keys()],rounds=[];
 for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if((r+i)%2)[h,a]=[a,h];m.push([h,a]);}rounds.push(m);arr.splice(1,0,arr.pop());}
 if(double)rounds.slice().forEach(m=>rounds.push(m.map(([h,a])=>[a,h])));
 const table=TEAMS.map(()=>({gp:0,w:0,otw:0,otl:0,l:0,gf:0,ga:0,pts:0,form:[]}));
 return{user,diff,per,rounds,round:0,phase:'regular',table,last:[],po:null,champ:null,me:{gp:0,w:0,gf:0,ga:0,ot:0}};
}
function applyResult(S,h,a,gh,ga,type){
 const T=S.table,H=T[h],A=T[a];H.gp++;A.gp++;H.gf+=gh;H.ga+=ga;A.gf+=ga;A.ga+=gh;
 const hw=gh>ga,W=hw?H:A,L=hw?A:H;
 if(type==='REG'){W.w++;W.pts+=3;L.l++;}else{W.otw++;W.pts+=2;L.otl++;L.pts+=1;}
 W.form.push(type==='REG'?'V':'VP');L.form.push(type==='REG'?'D':'DP');if(W.form.length>5)W.form.shift();if(L.form.length>5)L.form.shift();
}
function standings(S){return TEAMS.map((t,i)=>i).sort((x,y)=>{const a=S.table[x],b=S.table[y];
 return b.pts-a.pts||b.w-a.w||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});}
function userFixture(S){
 if(S.phase==='regular'){const m=S.rounds[S.round].find(p=>p.includes(S.user));return m?{h:m[0],a:m[1]}:null;}
 if(S.phase==='playoffs'){const s=S.po.series.find(x=>!x.done&&(x.a===S.user||x.b===S.user));if(!s)return null;
  const g=s.games.length,aHome=g%2===0;return{h:aHome?s.a:s.b,a:aHome?s.b:s.a,series:s};}
 return null;
}
function playDay(S,userRes){
 if(S.phase==='regular'){S.last=[];
  for(const[h,a]of S.rounds[S.round]){let r;if(userRes&&(h===S.user||a===S.user))r=userRes;else r=simMatch(h,a,false);
   applyResult(S,h,a,r.gh,r.ga,r.type);S.last.push({h,a,...r});trackMe(S,h,a,r);}
  S.round++;if(S.round>=S.rounds.length)startPlayoffs(S);return;}
 if(S.phase==='playoffs'){S.last=[];
  for(const s of S.po.series){if(s.done)continue;const g=s.games.length,aHome=g%2===0,h=aHome?s.a:s.b,a=aHome?s.b:s.a;
   let r;if(userRes&&(h===S.user||a===S.user))r=userRes;else r=simMatch(h,a,true);
   const hw=r.gh>r.ga,winner=hw?h:a;if(winner===s.a)s.wa++;else s.wb++;s.games.push({h,a,...r});S.last.push({h,a,...r});trackMe(S,h,a,r);
   if(s.wa>=s.need||s.wb>=s.need){s.done=true;s.win=s.wa>s.wb?s.a:s.b;}}
  if(S.po.series.every(s=>s.done)){const w=S.po.series.map(s=>s.win);S.po.history.push(S.po.series);
   if(w.length===1){S.phase='done';S.champ=w[0];}
   else{S.po.round++;S.po.series=[];for(let i=0;i<w.length;i+=2)S.po.series.push(mkSeries(w[i],w[i+1],S.po.round===2?3:2,S));}}
 }
}
function trackMe(S,h,a,r){if(h!==S.user&&a!==S.user)return;const me=S.me,mine=h===S.user;const gf=mine?r.gh:r.ga,ga=mine?r.ga:r.gh;
 me.gp++;me.gf+=gf;me.ga+=ga;if(gf>ga)me.w++;}
function mkSeries(x,y,need,S){const st=standings(S);const a=st.indexOf(x)<st.indexOf(y)?x:y,b=a===x?y:x;return{a,b,wa:0,wb:0,need,games:[],done:false};}
function startPlayoffs(S){
 const st=standings(S);S.seeds=st.slice(0,8);S.phase='playoffs';
 const s=st;S.po={round:0,history:[],series:[mkSeries(s[0],s[7],2,S),mkSeries(s[3],s[4],2,S),mkSeries(s[1],s[6],2,S),mkSeries(s[2],s[5],2,S)]};
}

let PID=1;
function mkP(o){const id='p'+(PID++);return Object.assign({id,st:{gp:0,g:0,a:0},yrs:2,age:25,nat:'SUI',pot:0},o,{id});}
function genName(r,foreign){if(foreign){const f=GEN_FOR[Math.floor(r()*GEN_FOR.length)];return f;}return [GEN_SUI[Math.floor(r()*GEN_SUI.length)],'SUI'];}
function freeNum(team,r){const used=new Set(Object.values(CAR.P).filter(p=>p.team===team).map(p=>p.num));let n;do{n=2+Math.floor((r||Math.random)()*96);}while(used.has(n));return n;}
function genPlayer(team,pos,ovr,r,foreign,age){const [n,nat]=genName(r,foreign);const a=age||Math.round(19+r()*14);const o=Math.round(ovr);
 return mkP({n,nat,pos,ovr:o,age:a,team,sal:salFor(o),yrs:1+Math.floor(r()*3),num:0,pot:a<23?Math.round(r()*6):0});}

function nBoxes(){const nl=myLeague()==='NL';return (nl?10:5)+6*(CAR.up.vip||0)+(CAR.up.arena?12:0);}
function boxValue(){const E=eco(),nl=myLeague()==='NL',S=CAR.S,row=S&&S.table?S.table[S.user]:null,form=row&&row.gp?(row.w+row.otw)/row.gp:0.5;
 return Math.round((nl?38000:14000)*(0.6+E.pop/100)*(1+0.06*(CAR.up.jumbotron||0)+0.04*(CAR.up.led||0)+(CAR.up.arena?0.15:0))*(0.9+form*0.2)/1000)*1000;}
function boxInit(){const E=CAR.eco;if(E.boxes)return;E.boxes=[];E.boxOffers=[];E.boxPrice=Math.round(boxValue()/5000)*5000;E.boxPrev=[];}
function boxInterest(){const E=eco(),v=boxValue();return clamp(0.55+E.pop/160+0.04*(CAR.fans||0)-1.1*(E.boxPrice/v-1),0.08,1.3);}
function freeBoxes(){const E=eco();return nBoxes()-E.boxes.length-0;}
function boxOffer(co,renew,old){const E=eco(),v=boxValue(),r=CAR.S?CAR.S.round:0;let offer=Math.round(Math.min(E.boxPrice,v*(0.8+rnd()*0.22)*(renew?1.04:1))/1000)*1000;
 let max=Math.round(v*(1.02+rnd()*0.28)*(renew?1.06:1)/1000)*1000;if(E.boxPrice<=offer){offer=E.boxPrice;max=Math.max(max,offer);}if(renew&&old)offer=Math.max(Math.min(old,max),offer);
 return{co,offer,max:Math.max(max,offer),renew:!!renew,exp:r+6};}
function boxSeasonStart(){const E=CAR.eco;boxInit();const prev=E.boxes.slice();E.boxes=[];E.boxOffers=[];const n=nBoxes(),it=boxInterest(),used=new Set();
 // les locataires de la saison passée reviennent d'abord (s'ils sont contents du prix)
 for(const b of prev){if(rnd()<clamp(0.35+it*0.5,0.1,0.92)&&E.boxOffers.length<n){E.boxOffers.push(boxOffer(b.co,true,b.price));used.add(b.co);}}
 const want=clamp(Math.round(n*it*(0.75+rnd()*0.4))-E.boxOffers.length,0,n+3);
 for(let i=0;i<want;i++){const pool=BOXCOS.filter(c=>!used.has(c));if(!pool.length)break;const c=pool[Math.floor(rnd()*pool.length)];used.add(c);E.boxOffers.push(boxOffer(c,false));}

function expPPG(p){return p.pos==='D'?Math.max(0.05,0.06+(p.ovr-65)*0.011):Math.max(0.08,0.12+(p.ovr-65)*0.022);}

function perfOf(p){const s=p.st||{gp:0};if(!s.gp||s.gp<3)return{r:null,lab:'Pas assez de matchs',cls:'na',stat:s.gp?`${s.gp} m.`:'—'};

 const lab=r>=1.25?'Très bonne':r>=0.95?'Bonne':r>=0.65?'Moyenne':'Mauvaise',cls=r>=1.25?'vg':r>=0.95?'g':r>=0.65?'m':'b';return{r,lab,cls,stat};}

function negoState(pid,kind){const p=CAR.P[pid],key=CAR.year+(mercatoOpen()?mercatoName():'');let N=CAR.nego[pid];if(N&&N.key===key&&N.kind===kind)return N;
 const nhl=p.team.startsWith('NHL:'),clubOvr=CAR.teams[CAR.club].ovr,star=p.ovr>=95,gap=p.ovr-clubOvr;
 let mult=perfMult(p)*(nhl?1.9:1)*(gap>8?1.2:gap>4?1.08:1)*(star?1.35:1)*(kind==='renew'?0.95:1)*(myLeague()==='SL'&&p.ovr>75?1.25:1);
 const ask=Math.round(salFor(p.ovr)*mult*(1+rnd()*0.12)/5000)*5000,res=Math.round(ask*(0.8+rnd()*0.1)/5000)*5000;
 const ymin=p.age>=32?1:p.age<=24?2:1,ymax=p.age>=33?2:p.age<=25?5:3;
 const wants=[nhl?'jouer un rôle majeur en première ligne':'du temps de jeu',p.age<=24?'progresser':p.age>=31?'la sécurité financière':'gagner des titres',rnd()<0.5?'un club ambitieux':'une bonne ambiance'];
 N=CAR.nego[pid]={key,kind,ask,res,ymin,ymax,pat:5,status:'open',wants,chat:[]};
 const club=CAR.teams[CAR.club].full,yrs=Math.min(ymax,ymin+1);
 const hi=kind==='renew'?`Salut coach. Je suis prêt à prolonger avec ${club}, mais je veux ${fmtCHF(ask)} CHF par saison sur ${yrs} ans.`:
  nhl?`Hello ! Quitter la NHL pour ${club}, c'est un vrai changement. Pour que je signe, il me faut ${fmtCHF(ask)} CHF par saison sur ${yrs} ans, et ${wants[0]}.`:
  `Bonjour ! Merci de l'intérêt de ${club}. Je demande ${fmtCHF(ask)} CHF par saison, sur ${yrs} ans. Ce qui compte pour moi : ${wants[1]}.`;
 N.chat.push({w:'him',t:hi});return N;}

 if(chantKind%2){for(let rep=0;rep<4;rep++){syl.forEach(([cc,vw],i)=>{shoutSyl(cc,vw,t,b*(i===syl.length-1?1.4:0.8),140+rep*4,v);drum(t,0.34);t+=b*(i===syl.length-1?1.5:0.9);});
   for(let k=0;k<3;k++){clapCrowd(t);drum(t,0.36);t+=b*0.5;}t+=b*0.4;}}

function fxStep(dt){for(const q of SHOW.fx){q.life-=dt;q.x+=q.vx*dt||0;q.y+=q.vy*dt||0;if(q.k==='smoke'){q.r+=dt*1.8;q.vx*=0.98;q.vy*=0.98;}if(q.vz!==undefined){q.z+=q.vz*dt;q.vz-=9.8*dt;if(q.z<0){q.z=0;q.vz=0;}}if(q.k==='ring')q.r+=dt*9;if(q.k==='conf'){q.vz=-1.6;q.a+=dt*6;}if(q.k==='pyro'){q.r+=dt*2.2;}if(q.k==='flame'){q.r+=dt*4.2;q.vx*=0.985;q.vy*=0.985;}}
 SHOW.fx=SHOW.fx.filter(q=>q.life>0);if(SHOW.fx.length>700)SHOW.fx.splice(0,SHOW.fx.length-700);}

// --- têtes de mascottes / tunnels (dessinées en coordonnées vue)
function drawDragon(c,R,jaw,hot,time){
 const rg=(x,y,r0,r1,st)=>{const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach(([o,k])=>g.addColorStop(o,k));return g;};
 const lg=(x0,y0,x1,y1,st)=>{const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,k])=>g.addColorStop(o,k));return g;};
 const u=R,P=(x,y)=>[x*u,y*u];
 const path=(pts,close=true)=>{c.beginPath();pts.forEach((p,i)=>{if(p.length===2){i?c.lineTo(p[0]*u,p[1]*u):c.moveTo(p[0]*u,p[1]*u);}else if(p.length===4)c.quadraticCurveTo(p[0]*u,p[1]*u,p[2]*u,p[3]*u);else c.bezierCurveTo(p[0]*u,p[1]*u,p[2]*u,p[3]*u,p[4]*u,p[5]*u);});if(close)c.closePath();};
 const flap=Math.sin(time*2.2)*0.08;
 // ---- WINGS (behind)
 for(const s of [-1,1]){c.save();c.scale(s,1);c.translate(0.55*u,-0.1*u);c.rotate(-flap);
  const tips=[[2.15,-1.95],[2.45,-1.05],[2.25,-0.25],[1.75,0.4]];
  // membrane
  c.fillStyle=lg(0,0,3*u,-1.5*u,[[0,'#0c2a12'],[0.6,'#1f5a2a'],[1,'#2f7a3a']]);
  c.beginPath();c.moveTo(0,0);c.lineTo(0.42*u,-1.05*u);c.lineTo(tips[0][0]*u,tips[0][1]*u);
  for(let i=1;i<tips.length;i++){const a=tips[i-1],b=tips[i];c.quadraticCurveTo((a[0]+b[0])/2*u*0.82,(a[1]+b[1])/2*u*0.82+0.15*u,b[0]*u,b[1]*u);}
  c.quadraticCurveTo(1.0*u,0.6*u,0.2*u,0.4*u);c.closePath();c.fill();
  c.strokeStyle='rgba(180,255,150,.15)';c.lineWidth=0.04*u;c.stroke();
  // bones
  c.strokeStyle=lg(0,0,3*u,-2*u,[[0,'#0a1a0c'],[1,'#1a3a1e']]);c.lineCap='round';
  c.lineWidth=0.085*u;c.beginPath();c.moveTo(0,0);c.lineTo(0.42*u,-1.05*u);c.lineTo(tips[0][0]*u,tips[0][1]*u);c.stroke();
  c.lineWidth=0.04*u;for(let i=1;i<tips.length;i++){c.beginPath();c.moveTo(0.42*u,-1.05*u);c.lineTo(tips[i][0]*u,tips[i][1]*u);c.stroke();}
  c.fillStyle='#d9cdb0';c.beginPath();c.moveTo(0.42*u,-1.05*u);c.lineTo(0.3*u,-1.32*u);c.lineTo(0.52*u,-1.1*u);c.fill();
  c.restore();}
 // ---- NECK / CHEST
 c.fillStyle=lg(0,0.2*u,0,1.7*u,[[0,'#164a1e'],[0.7,'#071a0b'],[1,'rgba(5,20,8,0)']]);path([[-0.55,0.15],[-0.6,0.8,-1.0,1.3,-1.25,1.75],[1.25,1.75],[1.0,1.3,0.6,0.8,0.55,0.15]]);c.fill();
 c.fillStyle='rgba(200,150,80,.25)';for(let i=0;i<4;i++){path([[-0.45+i*0.02,0.75+i*0.24],[0,0.68+i*0.24,0.45-i*0.02,0.75+i*0.24],[0,0.86+i*0.24,-0.45+i*0.02,0.75+i*0.24]]);c.fill();}
 // ---- HORNS (behind head)
 for(const s of [-1,1]){
  c.fillStyle=lg(s*0.5*u,-0.7*u,s*1.5*u,-2.2*u,[[0,'#2a2018'],[0.45,'#9c8a6c'],[1,'#f2ead6']]);
  path([[s*0.32,-0.78],[s*0.7,-1.2,s*1.2,-1.55,s*1.25,-2.35],[s*1.05,-1.75,s*0.85,-1.35,s*0.6,-0.6]]);c.fill();
  c.fillStyle=lg(s*0.7*u,-0.3*u,s*1.35*u,-0.6*u,[[0,'#3a2c20'],[1,'#e6dcc4']]);path([[s*0.72,-0.35],[s*1.1,-0.5,s*1.38,-0.72],[s*1.1,-0.35,s*0.75,-0.18]]);c.fill();}
 // ---- CHEEK FRILLS
 for(const s of [-1,1]){c.fillStyle=lg(s*0.7*u,0,s*1.45*u,0,[[0,'#14401c'],[1,'#3f8f3a']]);
  c.beginPath();c.moveTo(s*0.72*u,-0.45*u);const sp=[[1.4,-0.3],[1.05,-0.1],[1.5,0.12],[1.08,0.3],[1.38,0.55],[0.9,0.55]];
  for(const [x,y] of sp)c.lineTo(s*x*u,y*u);c.lineTo(s*0.6*u,0.25*u);c.closePath();c.fill();c.strokeStyle='rgba(240,190,90,.55)';c.lineWidth=0.025*u;c.stroke();
  c.strokeStyle='rgba(4,30,8,.6)';for(const [x,y] of sp.filter((_,i)=>i%2===0)){c.beginPath();c.moveTo(s*0.75*u,-0.1*u);c.lineTo(s*x*u,y*u);c.stroke();}}
 // ---- LOWER JAW (drawn before upper head so upper overlaps)
 const jo=jaw*0.62;
 c.save();c.translate(0,jo*u);
 c.fillStyle=lg(0,0.1*u,0,0.75*u,[[0,'#1a5222'],[1,'#08200d']]);path([[-0.5,0.08],[-0.55,0.45,-0.25,0.72,0,0.74],[0.25,0.72,0.55,0.45,0.5,0.08],[0,0.22,-0.5,0.08]]);c.fill();
 c.fillStyle='#efe6cc';for(let k=-3;k<=3;k++){const x=k*0.12,l=(Math.abs(k)===2?0.2:0.1);path([[x-0.04,0.17-Math.abs(k)*0.012],[x+0.04,0.17-Math.abs(k)*0.012],[x,0.17-l-Math.abs(k)*0.012]]);c.fill();}
 c.fillStyle='#2a5a2a';for(const s of [-1,0,1]){path([[s*0.2-0.05,0.62+(s?0:0.07)],[s*0.22,0.8+(s?0:0.08)],[s*0.2+0.05,0.62+(s?0:0.07)]]);c.fill();}
 c.restore();
 // throat
 {const h=0.06+jo*0.62;c.fillStyle=rg(0,(0.16+jo*0.35)*u,0.02*u,0.55*u,[[0,hot?'#fff6c4':'#3a0608'],[0.3,hot?'#ffa030':'#2a0405'],[1,hot?'#b2260c':'#0c0102']]);c.beginPath();c.ellipse(0,(0.13+jo*0.38)*u,0.42*u,h*0.62*u+0.02*u,0,0,7);c.fill();
  if(!hot&&jo>0.15){c.fillStyle='#8a2a30';c.beginPath();c.ellipse(0,(0.13+jo*0.6)*u,0.2*u,0.08*u,0,0,7);c.fill();}}
 // ---- HEAD (skull + snout)
 const headPath=()=>path([[0,-1.02],[0.5,-1.0,0.88,-0.78,0.86,-0.5],[0.84,-0.25,0.6,-0.05,0.5,0.12],[0.3,0.22,-0.3,0.22,-0.5,0.12],[-0.6,-0.05,-0.84,-0.25,-0.86,-0.5],[-0.88,-0.78,-0.5,-1.0,0,-1.02]]);
 headPath();c.fillStyle=rg(0,-0.75*u,0.05*u,1.15*u,[[0,'#56b04e'],[0.45,'#2a7030'],[1,'#082410']]);c.fill();
 c.save();headPath();c.clip();
 // scales
 for(let row=0;row<14;row++)for(let col=-9;col<=9;col++){const x=col*0.105+(row%2)*0.052,y=-1.02+row*0.085;const d=Math.abs(x)/0.9;c.fillStyle=`rgba(0,0,0,${0.14+d*0.12})`;c.beginPath();c.arc(x*u,y*u,0.06*u,0,Math.PI);c.fill();c.strokeStyle='rgba(210,255,170,.13)';c.lineWidth=0.012*u;c.beginPath();c.arc(x*u,y*u-0.01*u,0.055*u,Math.PI*1.1,Math.PI*1.9);c.stroke();}
 // top light + side shadow
 c.fillStyle=lg(-0.8*u,0,0.8*u,0,[[0,'rgba(0,0,0,.45)'],[0.35,'rgba(0,0,0,0)'],[0.65,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.45)']]);c.fillRect(-u,-1.1*u,2*u,1.4*u);
 if(hot){c.fillStyle=lg(0,0.25*u,0,-0.6*u,[[0,'rgba(255,140,40,.55)'],[1,'rgba(255,140,40,0)']]);c.fillRect(-u,-1.1*u,2*u,1.4*u);}
 c.restore();
 // dorsal ridge spikes
 for(let k=0;k<5;k++){const y=-1.0+k*0.14,w=0.07-k*0.008,h=0.16-k*0.02;c.fillStyle=lg(0,(y-h)*u,0,y*u,[[0,'#f0e2c0'],[1,'#6a3a20']]);path([[-w,y+0.02],[0,y-h],[w,y+0.02]]);c.fill();}
 // brow ridges (angry)
 for(const s of [-1,1]){c.fillStyle=lg(0,-0.7*u,0,-0.45*u,[[0,'#0e2a12'],[1,'#051208']]);path([[s*0.12,-0.48],[s*0.4,-0.72,s*0.86,-0.68],[s*0.9,-0.62],[s*0.6,-0.54,s*0.2,-0.4]]);c.fill();
  c.strokeStyle='rgba(210,255,170,.3)';c.lineWidth=0.02*u;c.beginPath();c.moveTo(s*0.15*u,-0.49*u);c.quadraticCurveTo(s*0.4*u,-0.72*u,s*0.86*u,-0.68*u);c.stroke();}
 // eyes (slit, glowing)
 for(const s of [-1,1]){const ex=s*0.5*u,ey=-0.5*u;c.save();c.translate(ex,ey);c.rotate(s*0.32);
  c.globalCompositeOperation='lighter';c.fillStyle=rg(0,0,0,0.42*u,[[0,'rgba(255,190,40,.75)'],[0.4,'rgba(255,120,20,.25)'],[1,'rgba(255,80,0,0)']]);c.beginPath();c.arc(0,0,0.42*u,0,7);c.fill();c.globalCompositeOperation='source-over';
  c.fillStyle=rg(0,0,0,0.17*u,[[0,'#fff6b0'],[0.5,'#ffc21e'],[1,'#d25a00']]);c.beginPath();c.moveTo(-0.2*u,0.02*u);c.quadraticCurveTo(0,-0.11*u,0.2*u,0);c.quadraticCurveTo(0,0.09*u,-0.2*u,0.02*u);c.fill();
  c.fillStyle='#160400';c.beginPath();c.ellipse(0,0,0.025*u,0.075*u,0,0,7);c.fill();c.restore();}
 // snout bridge + nostrils
 c.fillStyle=lg(0,-0.35*u,0,0.12*u,[[0,'rgba(110,190,90,.0)'],[1,'rgba(110,190,90,.55)']]);path([[-0.3,-0.35],[0,-0.42,0.3,-0.35],[0.38,0.08],[0,0.16,-0.38,0.08]]);c.fill();
 for(const s of [-1,1]){c.fillStyle='#0a0102';c.beginPath();c.ellipse(s*0.17*u,-0.02*u,0.07*u,0.04*u,s*0.5,0,7);c.fill();
  if(hot){c.fillStyle='rgba(255,150,40,.85)';c.beginPath();c.ellipse(s*0.17*u,-0.02*u,0.04*u,0.022*u,s*0.5,0,7);c.fill();}
  c.fillStyle='#e8dcc0';path([[s*0.3,-0.12],[s*0.42,-0.3],[s*0.38,-0.08]]);c.fill();}
 // upper lip & teeth
 c.fillStyle='#efe6cc';for(let k=-4;k<=4;k++){const x=k*0.105,big=Math.abs(k)===3,l=big?0.24:0.1,y0=0.13-Math.abs(k)*0.012;path([[x-0.04,y0],[x+0.04,y0],[x,y0+l]]);c.fill();}
 c.strokeStyle='#031208';c.lineWidth=0.035*u;c.beginPath();c.moveTo(-0.52*u,0.1*u);c.bezierCurveTo(-0.3*u,0.2*u,0.3*u,0.2*u,0.52*u,0.1*u);c.stroke();
 // rim glow when breathing
 if(hot){c.globalCompositeOperation='lighter';c.fillStyle=rg(0,0.35*u,0,2*u,[[0,'rgba(255,160,50,.55)'],[1,'rgba(255,60,0,0)']]);c.beginPath();c.arc(0,0.35*u,2*u,0,7);c.fill();c.globalCompositeOperation='source-over';}
}

function drawMascot(c,t){
 const kind=ENTRY_KIND[G.t[t].id]||'arch',col=G.col[t],yt=gateY(t),home=t===CRW.home,[mx,my]=VP(RW+4.6,yt),R=home?5.6:4.4,time=performance.now()/1000;
 const jaw=home?(SHOW.jaw||0):0.35+0.1*Math.sin(time*3);
 c.save();c.translate(mx,my);const [ix,iy]=VP(RW-10,yt);c.rotate(Math.atan2(iy-my,ix-mx)+Math.PI/2);
 const rg=(x,y,r0,r1,stops)=>{const g=c.createRadialGradient(x,y,r0,x,y,r1);stops.forEach(([o,cl])=>g.addColorStop(o,cl));return g;};
 const lg=(x0,y0,x1,y1,stops)=>{const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,cl])=>g.addColorStop(o,cl));return g;};
 const glowEye=(x,y,w,h,ang,cl)=>{c.save();c.translate(x,y);c.rotate(ang);c.fillStyle=rg(0,0,0,w*2.2,[[0,cl],[0.35,cl.replace(/[\d.]+\)$/,'0.35)')],[1,'rgba(0,0,0,0)']]);c.beginPath();c.arc(0,0,w*2.2,0,7);c.fill();
  c.fillStyle='#fff7c2';c.beginPath();c.ellipse(0,0,w,h,0,0,7);c.fill();c.fillStyle=cl;c.beginPath();c.ellipse(0,0,w*0.85,h*0.8,0,0,7);c.fill();c.fillStyle='#120400';c.beginPath();c.ellipse(0,0,w*0.16,h*0.75,0,0,7);c.fill();c.restore();};
 const throat=(w,h,hot)=>{c.fillStyle=rg(0,0,0.1,Math.max(w,h),[[0,hot>0.5?'#fff3b0':'#2a0405'],[0.35,hot>0.5?'#ff8a1e':'#4a070a'],[1,'#1a0203']]);c.beginPath();c.ellipse(0,0,w,h,0,0,7);c.fill();};
 if(kind==='dragon'){const D=home?7.2:R;c.save();c.translate(0,-0.05*D);drawDragon(c,D,jaw,SHOW.breathing?1:0,time);c.restore();}
 else if(kind==='lion'||kind==='tiger'){const tiger=kind==='tiger',fur=tiger?'#e8862a':'#c99550',furD=tiger?'#9a4a12':'#7a5222';
  if(!tiger){for(let ring=0;ring<3;ring++){const rr_=R*(1.75-ring*0.28);for(let i=0;i<26;i++){const a=i/26*Math.PI*2+ring*0.12,w=0.16;c.fillStyle=ring===0?'#5a3510':ring===1?'#7a4a1a':'#9a6428';c.beginPath();c.moveTo(Math.cos(a-w)*R*0.7,Math.sin(a-w)*R*0.75);c.quadraticCurveTo(Math.cos(a)*rr_*1.05,Math.sin(a)*rr_*1.05,Math.cos(a+w*1.8)*rr_,Math.sin(a+w*1.8)*rr_);c.lineTo(Math.cos(a+w)*R*0.7,Math.sin(a+w)*R*0.75);c.fill();}}}
  for(const s of [-1,1]){c.fillStyle=furD;c.beginPath();c.ellipse(s*R*0.72,-R*0.82,R*0.25,R*0.22,0,0,7);c.fill();c.fillStyle='#e9c9a0';c.beginPath();c.ellipse(s*R*0.72,-R*0.8,R*0.13,R*0.11,0,0,7);c.fill();}
  c.fillStyle=rg(0,-R*0.3,R*0.1,R*1.1,[[0,shade(fur,0.15)],[0.7,fur],[1,furD]]);c.beginPath();c.moveTo(0,-R*0.95);c.bezierCurveTo(R*0.75,-R*0.95,R*0.98,-R*0.3,R*0.82,R*0.25);c.bezierCurveTo(R*0.6,R*0.85,R*0.25,R*1.0,0,R*1.0);c.bezierCurveTo(-R*0.25,R*1.0,-R*0.6,R*0.85,-R*0.82,R*0.25);c.bezierCurveTo(-R*0.98,-R*0.3,-R*0.75,-R*0.95,0,-R*0.95);c.fill();
  if(tiger){c.fillStyle='#161210';for(const s of [-1,1]){for(let k=0;k<3;k++){c.beginPath();c.moveTo(s*R*0.92,-R*0.15+k*R*0.24);c.quadraticCurveTo(s*R*0.6,-R*0.1+k*R*0.24,s*R*0.45,-R*0.02+k*R*0.24);c.quadraticCurveTo(s*R*0.65,-R*0.02+k*R*0.24,s*R*0.9,-R*0.05+k*R*0.24);c.fill();}
    c.beginPath();c.moveTo(s*R*0.12,-R*0.9);c.quadraticCurveTo(s*R*0.22,-R*0.65,s*R*0.1,-R*0.5);c.lineTo(s*R*0.05,-R*0.85);c.fill();}}

  for(const s of [-1,1]){c.fillStyle=furD;c.beginPath();c.moveTo(s*R*0.12,-R*0.52);c.quadraticCurveTo(s*R*0.45,-R*0.62,s*R*0.66,-R*0.4);c.lineTo(s*R*0.55,-R*0.35);c.quadraticCurveTo(s*R*0.4,-R*0.48,s*R*0.15,-R*0.42);c.fill();glowEye(s*R*0.38,-R*0.3,R*0.13,R*0.085,s*0.25,tiger?'rgba(170,220,80,1)':'rgba(240,180,40,1)');}
  c.fillStyle=lg(0,-R*0.3,0,R*0.15,[[0,shade(fur,0.1)],[1,'#e8d2b0']]);c.beginPath();c.moveTo(-R*0.14,-R*0.25);c.lineTo(R*0.14,-R*0.25);c.lineTo(R*0.2,R*0.05);c.lineTo(-R*0.2,R*0.05);c.fill();

  c.fillStyle='#fffaf0';for(const s of [-1,1]){c.beginPath();c.moveTo(s*R*0.2,R*0.32);c.lineTo(s*R*0.12,R*0.32);c.lineTo(s*R*0.16,R*0.5);c.fill();}
  c.strokeStyle='rgba(60,40,30,.5)';c.lineWidth=0.05;for(const s of [-1,1])for(let k=0;k<3;k++){c.beginPath();c.moveTo(s*R*0.3,R*0.15+k*0.25);c.lineTo(s*R*0.85,R*0.05+k*0.35);c.stroke();}}
 else if(kind==='bear'){const fur='#5a3a1e';

  c.fillStyle=rg(0,-R*0.3,R*0.1,R*1.2,[[0,'#7a5430'],[0.7,fur],[1,'#2e1d0e']]);c.beginPath();c.ellipse(0,-R*0.05,R*1.0,R*0.95,0,0,7);c.fill();
  c.strokeStyle='rgba(20,10,4,.35)';c.lineWidth=0.06;for(let i=0;i<60;i++){const a=hash(i)*Math.PI*2,d=R*(0.3+hash(i+9)*0.65);c.beginPath();c.moveTo(Math.cos(a)*d,Math.sin(a)*d-R*0.05);c.lineTo(Math.cos(a)*(d+0.4),Math.sin(a)*(d+0.4)-R*0.05);c.stroke();}
  c.fillStyle=rg(0,R*0.2,0.1,R*0.6,[[0,'#c7a17a'],[1,'#8a6440']]);c.beginPath();c.ellipse(0,R*0.25,R*0.48,R*0.42,0,0,7);c.fill();
  for(const s of [-1,1])glowEye(s*R*0.36,-R*0.3,R*0.1,R*0.08,0,'rgba(240,150,40,1)');
  c.fillStyle='#120a05';c.beginPath();c.ellipse(0,R*0.05,R*0.18,R*0.12,0,0,7);c.fill();
  c.save();c.translate(0,R*0.38+jaw*R*0.12);throat(R*0.28,R*0.08+jaw*R*0.2,0);c.restore();

 for(const w of C.crew){if(e<0.8)continue;if(!w.tgt||w.tgt.gone){w.tgt=C.items.filter(i=>!i.gone&&!i.claim).sort((a,b)=>Math.hypot(a.x-w.x,a.y-w.y)-Math.hypot(b.x-w.x,b.y-w.y))[0]||null;if(w.tgt)w.tgt.claim=1;}
  const tx=w.tgt?w.tgt.x:RW+1,ty=w.tgt?w.tgt.y:50,dx=tx-w.x,dy=ty-w.y,d=Math.hypot(dx,dy),sp=Math.min(d,9*1/60);if(d>0.01){w.x+=dx/d*sp;w.y+=dy/d*sp;w.dx=dx/d;}if(w.tgt&&d<0.6){w.tgt.gone=1;w.carry++;w.tgt=null;}}
 for(const i of C.items){if(i.gone)continue;const [x,y]=VP(i.x,i.y);c.save();c.translate(x,y);c.rotate(i.a);
  if(i.k===0){c.fillStyle='rgba(120,200,120,.85)';c.fillRect(-0.18,-0.55,0.36,1.1);c.fillStyle='#ddd';c.fillRect(-0.1,-0.75,0.2,0.22);}
  else if(i.k===1){c.fillStyle='#c8a46a';c.beginPath();c.arc(0,0,0.45,0,7);c.fill();c.fillStyle='#8a6a3a';c.beginPath();c.arc(-0.3,-0.35,0.18,0,7);c.arc(0.3,-0.35,0.18,0,7);c.fill();}
  else{c.fillStyle=G.col[0].c1;c.fillRect(-0.9,-0.18,1.8,0.36);c.fillStyle=G.col[0].c2;c.fillRect(-0.3,-0.18,0.3,0.36);}c.restore();}
 for(const w of C.crew){const [x,y]=VP(w.x,w.y),f=(w.dx||-1)<0?-1:1;c.save();c.translate(x,y);
  c.fillStyle='rgba(20,40,70,.18)';c.beginPath();c.ellipse(0,0.05,1.1,0.4,0,0,7);c.fill();
  c.strokeStyle='#1d2433';c.lineWidth=0.38;c.lineCap='round';const ph=Math.sin(G.time*9)*0.35;c.beginPath();c.moveTo(-0.15,-1.9);c.lineTo(-0.3+ph,0);c.moveTo(0.15,-1.9);c.lineTo(0.3-ph,0);c.stroke();
  c.fillStyle='#ff7a1a';c.fillRect(-0.55,-3.4,1.1,1.6);c.fillStyle='#e8f04a';c.fillRect(-0.55,-2.7,1.1,0.18);
  c.fillStyle='#e8bc96';c.beginPath();c.arc(0,-3.85,0.36,0,7);c.fill();c.fillStyle='#f5f5f5';c.beginPath();c.arc(0,-4.0,0.38,Math.PI,0);c.fill();
  c.strokeStyle='#7a5a3a';c.lineWidth=0.14;c.beginPath();c.moveTo(0.4*f,-3.0);c.lineTo(1.4*f,0);c.stroke();c.fillStyle='#333';c.fillRect(1.0*f-0.4,-0.12,0.8,0.24);c.restore();}}
let last=performance.now(),acc=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(0.05,(t-last)/1000);last=t;FPS=FPS*0.97+(1/Math.max(dt,0.001))*0.03;if(FPS<40)LOWFX=true;else if(FPS>56)LOWFX=false;
 if(cur!=='game'||!G)return;
 if(AC&&AC.state!=='running'&&!paused&&settings.sound&&performance.now()>(window._acT||0)){window._acT=performance.now()+500;try{AC.resume();}catch(e){}}
 if(!paused&&SHOW.on){introStep(dt);crowdStep(dt);for(const k of ['shootUp','a','b','c','chk','blk','call','passReq','A','C'])IN[k]=false;}
 else if(!paused){acc+=dt*(performance.now()<SLOWMO?0.28:1);let n=0;while(acc>=1/120&&n<8){step(1/120);IN.shootUp=false;IN.a=false;IN.b=false;IN.c=false;IN.chk=false;IN.blk=false;IN.call=false;IN.passReq=false;IN.A=false;IN.C=false;acc-=1/120;n++;}if(n===8)acc=0;
  if(G&&G.state==='replay'){if(!REP.active)replayStart();replayApply();}else recFrame();crowdStep(dt);markIce();}
 updParts(dt);draw(dt);hud();commTick();}
renderMenu();show('menu');requestAnimationFrame(loop);
